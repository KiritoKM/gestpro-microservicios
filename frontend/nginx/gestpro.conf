server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name gestpro-analytics.local localhost 192.168.56.20;

    root /var/www/gestpro/frontend;
    index index.html;

    # Registro de logs
    access_log /var/log/nginx/gestpro_access.log;
    error_log /var/log/nginx/gestpro_error.log;

    # Servir archivos estáticos del frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia Microservicio 1: Users & Auth (:8001 en VM Backend)
    location /api/users/ {
        proxy_pass http://192.168.56.10:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso hacia Microservicio 2: Inventory & Catalog (:8002 en VM Backend)
    location /api/inventory/ {
        proxy_pass http://192.168.56.10:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso hacia Microservicio 3: Sales & Analytics (:8003 en VM Backend)
    location /api/analytics/ {
        proxy_pass http://192.168.56.10:8003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
